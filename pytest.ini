[pytest]
# Root of the checkout goes on sys.path so `from src.collecter... import`
# and `from src.models import` resolve - this is what mocks/clients.py and
# mocks/repository.py's imports assume, and previously worked only by
# accident of whichever directory pytest happened to be invoked from.
#
# tests/ itself is NOT listed here - it deliberately has no __init__.py, so
# pytest's own rootdir-insertion behavior (each test-containing directory
# with no __init__.py gets inserted onto sys.path) is what makes `from
# fixtures.api_responses import ...` / `from mocks.clients import ...` /
# `from strategies.apis import ...` resolve, the same way raw_spotify.py and
# strategies/apis.py already assume. Listing tests/ here too would be
# redundant with that, not a fix for anything currently broken.
pythonpath = .

asyncio_mode = auto

markers =
    slow: real multiprocessing / long-running
    collecter: anything under the collecter package
    integration: needs a real DB or real subprocesses
